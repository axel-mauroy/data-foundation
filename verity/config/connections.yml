# Dealinka — Verity Connection Profiles
# Aligned with Terraform datasets: verity_dev, verity_prod

default:
  target: bigquery_dev
  outputs:
    # Local development (no GCP dependency)
    local:
      type: datafusion
      threads: 4
      job_execution_timeout_seconds: 1800
      job_retries: 2

    # BigQuery dev — maps to Terraform google_bigquery_dataset.verity_dev
    # Requires: GOOGLE_CLOUD_PROJECT, GOOGLE_APPLICATION_CREDENTIALS, VERITY_DATASET
    bigquery_dev:
      target: dev
      outputs:
        dev:
          type: bigquery
          location: europe-west1
          method: oauth
          project_id: "{{ env_var('GCP_PROJECT') }}"
          dataset_id: "{{ env_var('VERITY_DATASET', 'verity_dev') }}"

    # BigQuery prod — maps to Terraform google_bigquery_dataset.verity_prod
    bigquery_prod:
      type: bigquery
      location: europe-west1
      method: oauth
      project_id: "{{ env_var('GCP_PROJECT') }}"
      dataset_id: "{{ env_var('VERITY_DATASET', 'verity_prod') }}"
